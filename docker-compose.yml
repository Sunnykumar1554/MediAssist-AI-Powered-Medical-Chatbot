version: "3.9"

services:
  # ── Ollama LLM Server ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment below to enable GPU passthrough (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Medical Chatbot (Flask App) ────────────────────────────────────────────
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-chatbot
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434   # Override to point at the ollama service
      - PORT=5000
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
